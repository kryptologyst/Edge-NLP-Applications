# Default configuration for Edge NLP Applications
defaults:
  - device: raspberry_pi
  - quant: int8
  - comms: mqtt

# Model configuration
model:
  name: "intent_lstm"
  type: "lstm"
  vocab_size: 1000
  embedding_dim: 16
  hidden_dim: 32
  num_classes: 10
  max_sequence_length: 5
  dropout: 0.2

# Training configuration
training:
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  optimizer: "adam"
  loss: "sparse_categorical_crossentropy"
  metrics: ["accuracy"]
  validation_split: 0.2
  early_stopping:
    patience: 10
    monitor: "val_loss"

# Data configuration
data:
  raw_data_path: "data/raw"
  processed_data_path: "data/processed"
  max_samples: 1000
  test_split: 0.2
  random_seed: 42

# Edge deployment configuration
deployment:
  target_device: "cpu"  # cpu, gpu, tpu, edge
  quantization: true
  pruning: false
  distillation: false
  export_formats: ["tflite", "onnx"]
  optimization_level: "default"  # default, aggressive

# Performance monitoring
monitoring:
  enable_profiling: true
  log_latency: true
  log_memory: true
  log_energy: false
  metrics_interval: 100

# Safety and privacy
safety:
  enable_privacy_filters: true
  mask_sensitive_data: true
  log_level: "INFO"
  disclaimer_required: true
